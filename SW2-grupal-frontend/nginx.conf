# ============================================================
# nginx.conf — Configuración para SPA React (Single Page App)
# Sirve archivos estáticos y redirige rutas a index.html
# para que React Router maneje el enrutamiento del lado cliente.
# ============================================================

server {
    # Cloud Run inyecta el puerto 8080 por defecto
    listen 8080;
    server_name _;

    # Raíz de los archivos estáticos compilados por Vite
    root /usr/share/nginx/html;
    index index.html;

    # ── Enrutamiento SPA ────────────────────────────────────
    # Intenta servir el archivo solicitado tal cual.
    # Si no existe (ej. /admin/elecciones), redirige a index.html
    # para que React Router maneje la ruta del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache de assets estáticos ───────────────────────────
    # Los archivos con hash de Vite (ej. assets/index-abc123.js)
    # se cachean agresivamente porque el nombre cambia con cada build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Compresión Gzip ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Seguridad básica ────────────────────────────────────
    # No exponer la versión de NGINX en headers
    server_tokens off;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
